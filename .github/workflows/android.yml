name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm ci
      - run: npm run content:check
      - run: npm run build
      - run: npx cap sync android

      # Debug APK: installable on any phone for testing.
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Stable phone-friendly download link:
      # https://github.com/monish-ui/mahabharat-katha/releases/latest/download/mahabharat-katha.apk
      - name: Publish APK to the "latest" GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mahabharat-katha.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest mahabharat-katha.apk --title "Latest build" --notes "Auto-built from main. Install on Android: allow unknown apps, then open." --latest
          gh release upload latest mahabharat-katha.apk --clobber
          gh release edit latest --notes "Auto-built from main at $(date -u +%Y-%m-%dT%H:%MZ), commit ${GITHUB_SHA::7}. Install on Android: allow unknown apps, then open."

      # Signed release AAB for Play Store, only when signing secrets are configured.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KS" | base64 -d > android/app/release.keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
      - name: Build release AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
